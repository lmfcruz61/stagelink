{% extends 'base.html' %}
{% block title %}Password alterada - StageHub{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl">
  <div class="sl-card p-6">
    <p class="text-sm font-semibold text-[#10B981]">Concluido</p>
    <h1 class="mt-2 text-3xl font-semibold">Password alterada</h1>
    <p class="mt-3 text-zinc-300">A tua password foi atualizada. Ja podes entrar com a nova password.</p>
    <p class="mt-2 text-sm text-zinc-500">Se nao foste tu a fazer esta alteracao, contacta o suporte StageHub.</p>
    <a class="sl-primary mt-5" href="{% url 'accounts:login' %}">Entrar</a>
  </div>
</section>
{% endblock %}
